<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مشغل الفيديو | دراما نتفلكس</title>
    <style>
        :root {
            --bg-main: #0a051b; 
            --bg-card: #140d2b; 
            --primary: #8a2be2; 
            --text-main: #ffffff; 
            --text-muted: #a7a2bd;
            --border: rgba(138, 43, 226, 0.15);
            --danger: #ef4444;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header { 
            background: #1a052e; padding: 15px 20px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100;
        }
        .back-btn { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; }
        .back-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .logo { font-size: 20px; font-weight: 800; color: #ffffff; text-decoration: none; }
        .logo span { color: var(--primary); }

        .player-layout { display: flex; flex-direction: column; gap: 20px; padding: 20px 15px; max-width: 1200px; margin: 0 auto; width: 100%; }
        @media (min-width: 768px) { .player-layout { grid-template-columns: 2fr 1fr; display: grid; align-items: start; } }

        .main-player-area { display: flex; flex-direction: column; gap: 15px; }
        
        .video-wrapper {
            position: relative; width: 100%; padding-top: 56.25%; background: #000;
            border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border);
        }
        .video-wrapper iframe, .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 2; }

        .loading-spinner-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; background: #070314; z-index: 5; transition: opacity 0.5s ease;
        }
        .spinner { width: 50px; height: 50px; animation: rotate 2s linear infinite; }
        .spinner circle { stroke: var(--primary); stroke-linecap: round; animation: dash 1.5s ease-in-out infinite; }
        
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes dash { 0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; } 50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; } 100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; } }

        .media-details { background: var(--bg-card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); position: relative; }
        .skeleton-line { background: linear-gradient(90deg, #1c133a, #281c54, #1c133a); background-size: 200% 100%; animation: skeleton-load 1.5s infinite; border-radius: 6px; }
        @keyframes skeleton-load { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        .media-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .media-meta { display: flex; gap: 15px; font-size: 13px; color: var(--text-muted); margin-bottom: 15px; align-items: center; }
        .rating-badge { background: rgba(255, 183, 3, 0.1); color: #ffb703; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
        .media-desc { font-size: 14px; color: #e2dfec; line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }

        .suggestions-area { display: flex; flex-direction: column; gap: 15px; }
        .suggestions-heading { font-size: 16px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .suggestions-heading svg { width: 18px; height: 18px; fill: var(--primary); }
        .suggestion-list { display: flex; flex-direction: column; gap: 12px; }
        
        .suggested-item { display: flex; gap: 12px; background: var(--bg-card); padding: 10px; border-radius: 14px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .suggested-item:hover { border-color: var(--primary); background: rgba(138, 43, 226, 0.05); }
        .suggested-thumb { width: 90px; height: 120px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
        .suggested-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .suggested-info { display: flex; flex-direction: column; justify-content: space-between; padding: 4px 0; }
        .suggested-title { font-size: 13px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .suggested-meta { font-size: 11px; color: var(--text-muted); }

        /* تصميم نافذة التنبيه الاحترافية العصرية البديلة لنظام الهاتف */
        .custom-alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 5, 27, 0.9); backdrop-filter: blur(8px);
            z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .custom-alert-box {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 30px 20px; border-radius: 24px; width: 100%; max-width: 380px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: alertZoom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes alertZoom { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .custom-alert-box svg { width: 48px; height: 48px; fill: var(--danger); margin-bottom: 15px; filter: drop-shadow(0 0 8px rgba(239,68,68,0.4)); }
        .custom-alert-text { font-size: 15px; font-weight: 600; line-height: 1.6; color: white; margin-bottom: 22px; }
        .custom-alert-btn {
            width: 120px; padding: 10px; background: linear-gradient(135deg, var(--primary), #6366f1);
            border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .custom-alert-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- نافذة التنبيه والخطأ العصرية البديلة من دراما نتفلكس -->
    <div class="custom-alert-overlay" id="customAlert">
        <div class="custom-alert-box">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 12 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <div class="custom-alert-text" id="customAlertText">تنبيه برمجى مخصص</div>
            <button class="custom-alert-btn" onclick="closeAlert()">موافق</button>
        </div>
    </div>

    <header>
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <a href="index.html" class="logo">دراما <span>NETFLIX</span></a>
    </header>

    <main class="player-layout">
        <div class="main-player-area">
            <div class="video-wrapper">
                <div class="loading-spinner-area" id="spinnerArea">
                    <svg class="spinner" viewBox="0 0 50 50">
                        <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                    </svg>
                </div>
                <div id="videoTarget"></div>
            </div>
            
            <div class="media-details" id="skeletonDetailBox">
                <div id="actualContent" style="display: none;">
                    <h1 class="media-title" id="loadTitle">--</h1>
                    <div class="media-meta">
                        <span id="loadYear">📅 --</span>
                        <span class="rating-badge" id="loadRating">⭐ --</span>
                        <span id="loadCat">🏷️ --</span>
                    </div>
                    <p class="media-desc" id="loadDesc">--</p>
                </div>
                <div id="skeletonView">
                    <div class="skeleton-line" style="width: 60%; height: 22px; margin-bottom: 12px;"></div>
                    <div class="skeleton-line" style="width: 40%; height: 14px; margin-bottom: 20px;"></div>
                    <div class="skeleton-line" style="width: 100%; height: 14px; margin-bottom: 8px;"></div>
                    <div class="skeleton-line" style="width: 85%; height: 14px;"></div>
                </div>
            </div>
        </div>

        <div class="suggestions-area">
            <div class="suggestions-heading">
                <svg viewBox="0 0 24 24"><path d="M19 9H5c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zM5 19v-8h14v8H5zm14-12H5c-.55 0-1-.45-1-1s.45-1 1-1h14c.55 0 1 .45 1 1s-.45 1-1 1zm-2-4H7c-.55 0-1-.45-1-1s.45-1 1-1h10c.55 0 1 .45 1 1s-.45 1-1 1z"/></svg>
                عروض قد تعجبك (اقتراحات)
            </div>
            <div class="suggestion-list" id="suggestionsContainer"></div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let activeIndex = urlParams.get('id');

        // دالة إظهار التنبيه الفاخر والمطور الجديد
        function showCustomAlert(text) {
            document.getElementById('customAlertText').innerText = text;
            document.getElementById('customAlert').style.display = 'flex';
        }

        function closeAlert() {
            document.getElementById('customAlert').style.display = 'none';
            window.location.href = 'index.html'; // إعادته تلقائياً بعد الإغلاق
        }

        function initializePlayer() {
            const movies = JSON.parse(localStorage.getItem('movies')) || [];
            
            if (activeIndex === null || !movies[activeIndex]) {
                if (movies.length > 0) { activeIndex = 0; } else {
                    showCustomAlert('لا توجد أفلام مضافة حالياً بالمنصة! يرجى الدخول إلى صفحة الإدمن أولاً لنشر المحتوى المفضل لديك.');
                    return;
                }
            }

            const current = movies[activeIndex];

            setTimeout(() => {
                document.getElementById('spinnerArea').style.opacity = '0';
                setTimeout(() => document.getElementById('spinnerArea').style.display = 'none', 500);
                
                document.getElementById('skeletonView').style.display = 'none';
                document.getElementById('actualContent').style.display = 'block';

                document.getElementById('loadTitle').innerText = current.title;
                document.getElementById('loadYear').innerText = `📅 ${current.year}`;
                document.getElementById('loadRating').innerText = `⭐ ${current.rating}`;
                
                const catNames = { movies: 'فيلم عالمي', series: 'مسلسل حصري', arabic: 'دراما عربية', turkish: 'دراما تركية', korean: 'دراما كورية' };
                document.getElementById('loadCat').innerText = `🏷️ ${catNames[current.category] || 'منوع'}`;
                document.getElementById('loadDesc').innerText = current.desc || 'مشاهدة ممتعة ومثيرة للعرض الحصري الحالي!';

                const videoTarget = document.getElementById('videoTarget');
                if (current.url.includes('<iframe') || current.url.includes('iframe')) {
                    videoTarget.innerHTML = current.url;
                } else {
                    videoTarget.innerHTML = `<video src="${current.url}" controls autoplay style="width:100%; height:100%; object-fit:cover;"></video>`;
                }
            }, 1500);

            const suggestionsContainer = document.getElementById('suggestionsContainer');
            suggestionsContainer.innerHTML = '';
            let hasSuggestions = false;

            movies.forEach((movie, index) => {
                if (parseInt(index) !== parseInt(activeIndex) && movie.category === current.category) {
                    hasSuggestions = true;
                    suggestionsContainer.innerHTML += `
                        <div class="suggested-item" onclick="window.location.href='player.html?id=${index}'">
                            <div class="suggested-thumb"><img src="${movie.img}"></div>
                            <div class="suggested-info">
                                <h4 class="suggested-title">${movie.title}</h4>
                                <div class="suggested-meta">📅 ${movie.year} | <span style="color:#ffb703;">⭐ ${movie.rating}</span></div>
                            </div>
                        </div>
                    `;
                }
            });

            if (!hasSuggestions) {
                suggestionsContainer.innerHTML = '<p style="color:var(--text-muted); font-size:12px; padding:10px;">لا توجد اقتراحات أخرى متطابقة حالياً.</p>';
            }
        }

        window.onload = initializePlayer;
    </script>
</body>
</html>
