<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دراما NETFLIX</title>
    <!-- كود تهيئة إعلانات جوجل آد موب المدمج -->
    <script async src="https://googlesyndication.com" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-main: #f9f9fc; 
            --bg-navbar: #1a052e; 
            --primary: #8a2be2; 
            --text-dark: #1a0a2a;
            --text-muted: #8c7e9a;
            --sidebar-width: 260px;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        body { background-color: var(--bg-main); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; position: relative; }
        
        header { background: var(--bg-navbar); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 100; }
        .header-right { display: flex; align-items: center; gap: 12px; }

        .menu-btn { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; padding: 4px; }
        .menu-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .logo { font-size: 20px; font-weight: 800; color: #ffffff; text-decoration: none; }
        .logo span { color: var(--primary); }
        
        .search-box { display: flex; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 50px; padding: 4px 14px; width: 45%; max-width: 250px; }
        .search-box input { background: none; border: none; color: white; width: 100%; padding: 6px; outline: none; font-size: 12px; }
        .search-box button { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; }
        .search-box svg { width: 14px; height: 14px; fill: white; }

        /* القائمة الجانبية المصلحة والمثبتة برمجياً */
        .sidebar { position: fixed; top: 0; right: -260px; width: var(--sidebar-width); height: 100vh; background: var(--bg-navbar); z-index: 150; transition: right 0.3s ease; box-shadow: -5px 0 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; padding: 24px 16px; }
        .sidebar.open { right: 0 !important; }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-title { color: white; font-size: 18px; font-weight: 700; }
        .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; }
        .close-btn svg { width: 22px; height: 22px; fill: currentColor; }

        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .sidebar-item a { display: flex; align-items: center; gap: 12px; color: #bfaed4; text-decoration: none; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .sidebar-item a:active { background: var(--primary); color: white; }
        .sidebar-item svg { width: 18px; height: 18px; fill: currentColor; }

        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); z-index: 140; display: none; }
        .overlay.show { display: block !important; }

        main { flex: 1; padding: 20px 15px; }
        .section-title { font-size: 17px; font-weight: 700; margin: 20px 0 15px 0; display: flex; align-items: center; gap: 8px; }
        .section-title svg { width: 18px; height: 18px; fill: var(--primary); }

        .shorts-container { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; scrollbar-width: none; }
        .shorts-container::-webkit-scrollbar { display: none; }
        
        .effect-short-card { min-width: 120px; height: 200px; background: linear-gradient(135deg, #eeeaf8 0%, #e1d7f3 100%); border-radius: 18px; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 12px; }
        .effect-short-card::before, .effect-movie-card::before { content: ""; position: absolute; top: 0; left: -150px; width: 150px; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent); animation: loading-scan 2s infinite ease-in-out; }
        @keyframes loading-scan { 0% { left: -150px; } 100% { left: 100%; } }
        .effect-text-line { width: 80%; height: 12px; background: rgba(138, 43, 226, 0.2); border-radius: 6px; }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .effect-movie-card { background: #ffffff; border-radius: 20px; overflow: hidden; border: 1px solid rgba(138, 43, 226, 0.05); display: flex; flex-direction: column; position: relative; }
        .effect-movie-thumb { width: 100%; height: 220px; background: linear-gradient(135deg, #eeeaf8, #e1d7f3); }
        .effect-movie-info { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .line-1 { width: 90%; height: 14px; background: rgba(138, 43, 226, 0.2); border-radius: 4px; }
        .line-2 { width: 50%; height: 10px; background: rgba(138, 43, 226, 0.1); border-radius: 4px; }

        .real-card { cursor: pointer; }
        .real-video { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
        .real-img { width: 100%; height: 100%; object-fit: cover; }

        .watch-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: linear-gradient(135deg, var(--primary), #6366f1); color: white; border: none; text-decoration: none; padding: 10px; margin-top: 8px; border-radius: 12px; font-size: 13px; font-weight: bold; width: 100%; cursor: pointer; }
        .watch-btn:active { transform: scale(0.95); }
        .watch-btn svg { width: 14px; height: 14px; fill: white; }

        footer { background: var(--bg-navbar); padding: 30px 20px; text-align: center; margin-top: 40px; border-radius: 24px 24px 0 0; }
        .footer-socials { display: flex; justify-content: center; gap: 18px; margin-bottom: 15px; }
        .footer-socials a { color: #bfaed4; width: 42px; height: 42px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .footer-socials svg { width: 20px; height: 20px; fill: currentColor; }
        .footer-rights { font-size: 12px; color: #bfaed4; }
        .footer-rights span { color: #ffffff; font-weight: bold; }
    </style>
</head>

    <script>
        function toggleMenu(open) {
            const sidebar = document.getElementById('sidebarMenu');
            const overlay = document.getElementById('menuOverlay');
            if (open) {
                sidebar.classList.add('open');
                overlay.classList.add('show');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        }

        function loadContent() {
            const movies = JSON.parse(localStorage.getItem('movies')) || [];
            const shorts = JSON.parse(localStorage.getItem('shorts')) || [];
            
            if (movies.length > 0) {
                const moviesGrid = document.getElementById('moviesGrid');
                moviesGrid.innerHTML = '';
                movies.forEach((movie, index) => {
                    const isVip = movie.type === 'vip';
                    const badge = isVip ? `<span style="position:absolute; top:10px; right:10px; background:linear-gradient(135deg, #ffd700, #ffa500); color:#000; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:bold; z-index:5;">🔐 VIP</span>` : '';
                    
                    moviesGrid.innerHTML += `
                        <div class="effect-movie-card real-card" data-cat="${movie.category}">
                            <div class="effect-movie-thumb" onclick="handleWatch(${index}, '${movie.type}', '${movie.key}')">
                                ${badge}
                                <img src="${movie.img}" class="real-img">
                            </div>
                            <div class="effect-movie-info">
                                <h3 style="font-size:13px; font-weight:700; height:38px; overflow:hidden;">${movie.title}</h3>
                                <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
                                    <span>📅 ${movie.year}</span>
                                    <span style="color:#ffb703; font-weight:bold;">⭐ ${movie.rating}</span>
                                </div>
                                <button onclick="handleWatch(${index}, '${movie.type}', '${movie.key}')" class="watch-btn" style="${isVip ? 'background: linear-gradient(135deg, #ffd700, #b8860b); color: #000;' : ''}">
                                    مشاهدة الآن
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            if (shorts.length > 0) {
                const shortsContainer = document.getElementById('shortsContainer');
                shortsContainer.innerHTML = '';
                shorts.forEach(short => {
                    shortsContainer.innerHTML += `
                        <div class="effect-short-card real-card" onclick="window.open('${short.url}', '_blank')">
                            <video src="${short.url}" class="real-video" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>
                            <div style="position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,0.8)); padding:10px; border-radius:16px;">
                                <div style="font-size:11px; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${short.title}</div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // دالة تشغيل المشاهدة + إطلاق الإعلان الفوري عند الضغط
        function handleWatch(index, type, key) {
            // تشغيل إعلان جوجل آد موب البيني تلقائياً هنا
            if (typeof adsbygoogle !== 'undefined') {
                (adsbygoogle = window.adsbygoogle || []).push({});
            }

            if (type === 'vip') {
                const userKey = prompt("🔒 هذا العرض VIP باشتراك مدفوع!\nتواصل معنا لتفعيل حسابك والحصول على الرمز.\n\nاكتب رمز التفعيل هنا:");
                if (userKey === key) {
                    window.location.href = `player.html?id=${index}`;
                } else if (userKey !== null) {
                    alert("❌ رمز التفعيل خاطئ!");
                }
            } else {
                window.location.href = `player.html?id=${index}`;
            }
        }

        function filterContent(category) {
            toggleMenu(false);
            const cards = document.querySelectorAll('#moviesGrid .real-card');
            const shortsSection = document.getElementById('shortsWrapper');
            const gridTitle = document.getElementById('gridTitle');
            
            if (category === 'all') {
                if (shortsSection) shortsSection.style.display = 'block';
                gridTitle.innerHTML = `أحدث الأفلام والدراما الحصرية`;
                cards.forEach(card => card.style.display = 'flex');
            } else {
                if (shortsSection) shortsSection.style.display = 'none';
                const catNames = { movies: 'الأفلام العالمية', series: 'المسلسلات الحصرية', arabic: 'المسلسلات العربية', turkish: 'المسلسلات التركية', korean: 'المسلسلات الكورية' };
                gridTitle.innerHTML = `قسم: ${catNames[category] || ''}`;
                cards.forEach(card => {
                    card.style.display = card.getAttribute('data-cat') === category ? 'flex' : 'none';
                });
            }
        }

        window.onload = loadContent;
    </script>
